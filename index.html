<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatherlink Web Console — station console for the web</title>
    <meta
      name="description"
      content="Independent web console for WeatherLink® stations. Live dashboard and TV share links. Start free. Not affiliated with Davis Instruments."
    />
    <meta name="theme-color" content="#0284c7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="canonical" href="https://wwebconsole.com/" />
    <meta property="og:image" content="https://wwebconsole.com/og.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wwc_theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
