<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WWebConsole — WeatherLink console for the web</title>
    <meta
      name="description"
      content="Cloud weather console for Davis WeatherLink stations. Live dashboard, TV share links, and secure API credentials. Start free."
    />
    <meta name="theme-color" content="#0284c7" />
    <link rel="canonical" href="https://wwebconsole.com/" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wwc_theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
