name: wwebconsole_app
description: "Weatherlink Web Console mobile app."
publish_to: 'none'

# In Android, build-name is used as versionName, build-number as versionCode.
version: 1.5.2+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon_master.png"
  adaptive_icon_background: "#0EA5E9"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0EA5E9"
  image: "assets/icons/splash_logo.png"
  android_12:
    image: "assets/icons/splash_logo.png"
    icon_background_color: "#0EA5E9"
